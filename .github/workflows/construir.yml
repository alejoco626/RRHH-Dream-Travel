name: Construir RRHH.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requisitos.txt pyinstaller
      - name: Poner la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace 'VERSION = ".*"', "VERSION = `"$v`"" | Set-Content version.py -Encoding utf8
          Get-Content version.py
      - name: Probar la lógica
        run: python -m unittest pruebas_logica
      - name: Crear RRHH.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name RRHH
          --icon plantillas/icono.ico
          --add-data "plantillas;plantillas" rrhh.py
      - uses: actions/upload-artifact@v4
        with:
          name: RRHH-windows
          path: dist/RRHH.exe
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RRHH.exe
          generate_release_notes: true
