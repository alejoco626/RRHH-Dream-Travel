name: Construir RRHH.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          pip install -r requisitos.txt pyinstaller
      - name: Poner la versión de la etiqueta
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace 'VERSION = ".*"', "VERSION = `"$v`"" | Set-Content version.py -Encoding utf8
          Get-Content version.py
      - name: Probar la lógica
        run: python -m unittest pruebas_logica
      - name: Comprobar pywebview
        run: python -c "import webview, clr_loader; print(webview.__file__)"
      - name: Crear RRHH.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name RRHH
          --icon plantillas/icono.ico
          --add-data "plantillas;plantillas" --add-data "web;web"
          --collect-all webview --collect-all clr_loader --collect-all pythonnet rrhh.py
      - name: Probar que la app arranca
        shell: pwsh
        run: |
          $env:RRHH_PRUEBA_ARRANQUE = "1"
          $env:RRHH_DATOS = "$env:RUNNER_TEMP\datos_prueba"
          $p = Start-Process -FilePath dist\RRHH.exe -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "La app no cerró sola: la interfaz no cargó" }
          $log = "$env:LOCALAPPDATA\DreamTravel\rrhh_error.log"
          if (Test-Path $log) { Get-Content $log; throw "La app registró errores al arrancar" }
      - name: Crear el instalador
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if (-not ($v -match '^\d')) { $v = "0.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVersionApp=$v" instalador.iss
          if ($LASTEXITCODE -ne 0) { throw "Falló Inno Setup" }
      - uses: actions/upload-artifact@v4
        with:
          name: RRHH-windows
          path: |
            dist/RRHH.exe
            salida/RRHH-Instalador.exe
      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag dist/RRHH.exe salida/RRHH-Instalador.exe --clobber
